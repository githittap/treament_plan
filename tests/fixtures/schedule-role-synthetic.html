<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>합성 근무표</title>
<style>

</style><main class="card"><h2>🗓 근무표 <span class="sub">합성 데이터 · 실데이터 미사용</span></h2><div class="tblwrap"><table class="schedule-role-table"><tr><th>직무·상태</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th><th>일</th></tr><tr><th>Dr.</th><td><details class="schedule-role-cell"><summary>Dr. · 1명</summary><div class="schedule-check-list"><label class="schedule-check role-dr"><input type="checkbox" checked>합성 Dr A</label></div></details></td><td colspan="6">-</td></tr><tr><th>진료실</th><td colspan="2"><details class="schedule-role-cell"><summary>진료실 · 1명</summary><div class="schedule-check-list"><label class="schedule-check role-clinic"><input type="checkbox">합성 직원 A</label></div></details></td><td colspan="5">-</td></tr><tr><th>데스크</th><td colspan="7"><details class="schedule-role-cell"><summary>데스크 · 1명</summary><div class="schedule-check-list"><label class="schedule-check role-desk"><input type="checkbox">합성 직원 B</label></div></details></td></tr><tr><th>기공·행정</th><td colspan="7">-</td></tr><tr><th>상담</th><td colspan="7">-</td></tr><tr><th>야간</th><td colspan="7"><details class="schedule-role-cell" open><summary>야간 · 전체 직원</summary><div class="schedule-check-list"><label class="schedule-check role-dr"><input type="checkbox">합성 Dr A</label><label class="schedule-check role-clinic"><input type="checkbox">합성 직원 A</label><label class="schedule-check role-desk"><input type="checkbox">합성 직원 B</label></div></details></td></tr><tr><th>OFF</th><td colspan="7">-</td></tr><tr><th>연차·반차</th><td colspan="7"><div class="schedule-leave-list">합성 직원 C · 연차</div></td></tr></table></div><p class="hint">화면 확인용 합성 데이터입니다. 운영 DB·개인정보·실제 제출은 사용하지 않았습니다.</p></main>
