<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>합성 통합 캘린더</title><style>body{font:14px sans-serif;background:#0d1715;color:#e6f2ef;padding:16px}.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(80px,1fr));gap:4px;max-width:900px}.cal-cell,.cal-dow{border:1px solid #24332f;padding:6px;min-height:92px;background:#14201d}.cal-dow{min-height:auto;color:#8fa5a0}.cal-tag{display:block;margin-top:4px;padding:2px 4px;border-radius:4px;font-size:11px}.hol{color:#e3b341}.dept{color:#7fd8ff}.evening{color:#f0b8ff}.lv{color:#9ee6a9}.off{color:#ff7b76}.status{color:#2fd9c4}@media(max-width:640px){.cal-grid{min-width:620px}.cal-cell{min-height:72px;font-size:12px}}</style><p>합성 데이터 · 전체 보기</p><div class="cal-grid"><div class="cal-dow">일</div><div class="cal-dow">월</div><div class="cal-dow">화</div><div class="cal-dow">수</div><div class="cal-dow">목</div><div class="cal-dow">금</div><div class="cal-dow">토</div><div class="cal-cell"><b>1</b><span class="cal-tag hol">공휴일 · 휴무 단정 아님</span><span class="cal-tag dept">상담 1명 · 합성 직원</span><span class="cal-tag evening">야간 1명 · 합성 Dr.</span><span class="cal-tag lv">연차 ① · 합성 직원</span><span class="cal-tag off">OFF 1명</span><span class="cal-tag status">작성 중</span></div></div>
